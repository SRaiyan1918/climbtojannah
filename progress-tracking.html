<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progress Tracking - Climb to Jannah</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
      /* --- Base & Theme Colors --- */
    :root {
      --accent-green:#0f6d5b;
      --bg-primary: #e6f5f1;
      /* Soft greenish background */
      --bg-secondary: #ffffff;
      --accent-red: #ef466f;
      /* For bad deeds */
      --accent-yellow: #f59e0b;
      /* Highlight / stars */
      --text-primary: #0f172a;
      /* Dark text */
      --text-muted: #6b7280;
      /* Grey text */
      --border: rgba(15, 109, 91, 0.2);
      --radius: 14px;
      font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }
    
    /* --- Global Styles --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      font-size: 16px;
      transition: margin-left 0.3s ease;
    }
    
    body.sidebar-open {
      margin-left: 250px;
    }
    
    /* --- Header & Nav --- */
    header nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: var(--bg-secondary);
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
      border-radius: var(--radius);
      position: relative;
      z-index: 100;
    }
    
    nav .left,
    nav .right {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    nav button {
      background: none;
      border: none;
      cursor: pointer;
      transition: color 0.3s ease;
      padding: 8px;
      border-radius: 8px;
    }
    
    nav button:hover {
      background-color: rgba(15, 109, 91, 0.1);
    }
    
    nav .title #title {
      font-size: 22px;
      font-weight: 900;
      color: var(--accent-green);
    }
    
    nav .title #title em {
      font-style: normal;
      color: var(--accent-green);
    }
    
    nav .title #sub-title {
      font-size: 14px;
      color: var(--text-muted);
    }
    
    /* --- Sidebar --- */
    .sidebar-container {
      position: fixed;
      top: 0;
      left: -300px;
      width: 250px;
      height: 100vh;
      background: var(--bg-secondary);
      box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
      transition: left 0.3s ease;
      z-index: 99;
      overflow-y: auto;
    }
    
    .sidebar-container.open {
      left: 0;
    }
    
    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .sidebar-header img {
      width: 40px;
      height: 40px;
    }
    
    .sidebar-header h3 {
      color: var(--accent-green);
      font-size: 18px;
    }
    
    .sidebar-menu {
      padding: 20px 0;
    }
    
    .sidebar-menu ul {
      list-style: none;
    }
    
    .sidebar-menu li {
      margin-bottom: 5px;
    }
    
    .sidebar-menu a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      color: var(--text-primary);
      text-decoration: none;
      transition: background-color 0.2s ease;
    }
    
    .sidebar-menu a:hover {
      background-color: rgba(15, 109, 91, 0.1);
    }
    
    .sidebar-menu a.active {
      background-color: rgba(15, 109, 91, 0.15);
      border-right: 3px solid var(--accent-green);
      color: var(--accent-green);
    }
    
    .sidebar-menu i {
      font-size: 18px;
      width: 24px;
      text-align: center;
    }
    
    /* --- Greeting Section --- */
    header .greeting {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin: 30px 0;
      text-align: center;
    }
    
    /* Your existing CSS styles */
    .progress-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .time-period-selector {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .time-period-btn {
      padding: 12px 24px;
      background: white;
      color: var(--accent-green);
      border-radius: var(--radius);
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
      color: blue;
    }

    .time-period-btn.active {
      background-color: rgba(0, 0, 0, 0);
      border: 2px solid blue;
      color: blue;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: var(--bg-secondary);
      padding: 24px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      text-align: center;
    }

    .stat-card.good {
      border-left: 4px solid var(--accent-green);
    }

    .stat-card.bad {
      border-left: 4px solid var(--accent-red);
    }

    .stat-card.points {
      border-left: 4px solid var(--accent-yellow);
    }

    .stat-number {
      font-size: 2.5rem;
      font-weight: bold;
      margin: 10px 0;
    }

    .stat-card.good .stat-number {
      color: darkgreen;
    }

    .stat-card.bad .stat-number {
      color: var(--accent-red);
    }

    .stat-card.points .stat-number {
      color: var(--accent-yellow);
    }

    .chart-container {
      background: var(--bg-secondary);
      padding: 24px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      margin-bottom: 30px;
      height: 400px;
    }

    .deeds-breakdown {
      background: var(--bg-secondary);
      padding: 24px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }

    .breakdown-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }

    .breakdown-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
      background: white;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .breakdown-item.good {
      border-left: 4px solid var(--accent-green);
    }

    .breakdown-item.bad {
      border-left: 4px solid var(--accent-red);
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
    }

    .empty-state i {
      font-size: 3rem;
      margin-bottom: 20px;
      color: var(--text-muted);
    }

    .period-info {
      text-align: center;
      margin-bottom: 20px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
        /* --- Footer --- */
    .site-footer {
      background: var(--bg-secondary);
      text-align: center;
      padding: 16px;
      margin-top: 30px;
      border-top: 1px solid var(--border);
      font-size: 14px;
      color: var(--text-muted);
    }
    
    
    /* --- Overlay for mobile --- */
.overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.5);
  z-index: 98;
  display: none;
}

.overlay.active {
  display: block;
}
@media (max-width: 768px) {
  body.sidebar-open {
    margin-left: 0;
  }
  
  .sidebar-container {
    width: 280px;
  }
}
  </style>
</head>
<body>
    <!-- Overlay for mobile sidebar -->
  <div class="overlay" id="overlay"></div>
  
  <!-- Sidebar -->
  <div class="sidebar-container" id="sidebar">
    <div class="sidebar-header">
      <img src="logo.png" alt="Climb to Jannah Logo">
      <h3>Climb to Jannah</h3>
    </div>
    <nav class="sidebar-menu">
      <ul>
        <li><a href="/index.html"><i class="bi bi-house-door"></i> Dashboard</a></li>
        <li><a href="/daily-goals.html"><i class="bi bi-calendar-check"></i> Daily Goals</a></li>
        <li><a href="#" class="active"><i class="bi bi-graph-up"></i> Progress Tracking</a></li>
        <li><a href="/Deed-journal.html"><i class="bi bi-journal-text"></i> Deed Journal</a></li>
        <li><a href="/Help-&-Support.html"><i class="bi bi-question-circle"></i> Help & Support</a></li>
      </ul>
    </nav>
  </div>
  
  <header>
    <nav>
      <div class="left">
        <div class="sidebar">
          <button id="sidebar-toggle" aria-label="Toggle Sidebar"><i class="bi bi-layout-sidebar"></i></button>
        </div>
        <div class="logo">
          <img src="logo.png" alt="Climb to Jannah Logo" width="40">
        </div>
        <div class="title">
          <div id="title">Progress Tracking</div>
          <div id="sub-title">See your progress and Improve yourself</div>
        </div>
      </div>
      <div class="right">
        <div class="navigate-buttons">
          <div class="challenges">
            <button aria-label="Challenges"><i class="bi bi-flag"></i></button>
          </div>
        </div>
        <div class="person">
          <button aria-label="Profile"><i class="bi bi-person-circle"></i></button>
        </div>
      </div>
    </nav>
  </header>
  
  <!-- Your existing sidebar and header code -->
  
  <main>
    <div class="progress-container">
      <!-- Stats Overview -->
      <div class="stats-grid">
        <div class="stat-card good">
          <i class="bi bi-check-circle-fill" style="color: darkgreen; font-size: 2rem;"></i>
          <div class="stat-number" id="good-deeds-count">0</div>
          <div class="stat-label">Good Deeds</div>
        </div>
        
        <div class="stat-card bad">
          <i class="bi bi-x-circle-fill" style="color: var(--accent-red); font-size: 2rem;"></i>
          <div class="stat-number" id="bad-deeds-count">0</div>
          <div class="stat-label">Bad Deeds Avoided</div>
        </div>
        
        <div class="stat-card points">
          <i class="bi bi-trophy-fill" style="color: var(--accent-yellow); font-size: 2rem;"></i>
          <div class="stat-number" id="total-points">0</div>
          <div class="stat-label">Total Points</div>
        </div>
      </div>

      <!-- Chart Section -->
      <div class="chart-container">
        <canvas id="progressChart"></canvas>
      </div>

      <!-- Detailed Breakdown -->
      <div class="deeds-breakdown">
        <h3>Detailed Breakdown</h3>
        <div class="breakdown-grid" id="breakdown-container">
          <!-- Will be populated by JavaScript -->
        </div>
      </div>
    </div>
  </main>
  <footer class="site-footer">
    <p>© 2025 Climb to Jannah | "Every step counts on the way to Jannah."</p>
  </footer>
<script type="module">
    // Import Firebase SDKs
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    
    // Your Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyCh2NU6B9XgZe3wJ0nqRZpZlb-CqVBEcsQ",
      authDomain: "climb-to-jannah.firebaseapp.com",
      projectId: "climb-to-jannah",
      storageBucket: "climb-to-jannah.firebasestorage.app",
      messagingSenderId: "1063545296291",
      appId: "1:1063545296291:web:9bb3204542dfa7ec8cb616",
      measurementId: "G-SP62WZCPXC"
    };
    
    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Sidebar toggle functionality
    const sidebarToggle = document.getElementById('sidebar-toggle');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    const body = document.body;

    sidebarToggle.addEventListener('click', () => {
      sidebar.classList.toggle('open');
      overlay.classList.toggle('active');
      body.classList.toggle('sidebar-open');
    });

    overlay.addEventListener('click', () => {
      sidebar.classList.remove('open');
      overlay.classList.remove('active');
      body.classList.remove('sidebar-open');
    });

    // Close sidebar when clicking on a menu item (for mobile)
    const menuItems = document.querySelectorAll('.sidebar-menu a');
    menuItems.forEach(item => {
      item.addEventListener('click', () => {
        if (window.innerWidth <= 768) {
          sidebar.classList.remove('open');
          overlay.classList.remove('active');
          body.classList.remove('sidebar-open');
        }
      });
    });

    let progressChart = null;
    let currentUser = null;

    // Check authentication
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        loadProgressData(user.uid);
      } else {
        // Redirect to dashboard if not logged in
        window.location.href = '/index.html';
      }
    });

    // Load progress data from Firestore
    async function loadProgressData(uid) {
      try {
        const userRef = doc(db, "users", uid);
        const userSnap = await getDoc(userRef);
        
        if (userSnap.exists()) {
          const userData = userSnap.data();
          updateProgressData(userData);
        }
      } catch (error) {
        console.error("Error loading progress data:", error);
      }
    }

    // Function to get progress data from Firebase
    function getProgressData(userData) {
      const lifetimeData = userData.lifetimeData || {
        totalGoodDeeds: 0,
        totalBadDeeds: 0,
        totalPoints: 0,
        deedFrequency: {}
      };

      return {
        goodDeeds: lifetimeData.totalGoodDeeds || 0,
        badDeeds: lifetimeData.totalBadDeeds || 0,
        totalPoints: lifetimeData.totalPoints || 0,
        breakdown: getSimpleBreakdown(lifetimeData.deedFrequency || {}),
        chartData: getSimpleChartData(lifetimeData.deedFrequency || {})
      };
    }

    // Simple breakdown from deed frequency
    function getSimpleBreakdown(deedFrequency) {
      const breakdown = [];
      
      for (const [deedName, data] of Object.entries(deedFrequency)) {
        breakdown.push({
          name: deedName,
          type: data.type,
          count: data.count,
          points: calculateDeedPoints(deedName, data.type)
        });
      }
      
      return breakdown.sort((a, b) => b.count - a.count);
    }

    // Calculate points for a deed
    function calculateDeedPoints(deedName, type) {
      const predefinedGoodDeeds = [
        { text: "Pray Fajr on time", points: 100 },
        { text: "Pray Zohar on time", points: 100 },
        { text: "Pray Asar on time", points: 100 },
        { text: "Pray Magrib on time", points: 100 },
        { text: "Pray Esah on time", points: 100 },
        { text: "Read Quran for 10 minutes", points: 95 },
        { text: "Help someone in need", points: 88 },
        { text: "Give charity", points: 90 }
      ];

      const predefinedBadDeeds = [
        { text: "Lying", points: -95 },
        { text: "Wasting time", points: -90 },
        { text: "Explicit content", points: -100 },
        { text: "Anger", points: -85 }
      ];

      if (type === 'good') {
        const deed = predefinedGoodDeeds.find(d => d.text === deedName);
        return deed ? deed.points : 35; // Default points for custom good deeds
      } else {
        const deed = predefinedBadDeeds.find(d => d.text === deedName);
        return deed ? deed.points : -65; // Default points for custom bad deeds
      }
    }

    // Simple chart data from top deeds
    function getSimpleChartData(deedFrequency) {
      const topDeeds = Object.entries(deedFrequency)
        .sort((a, b) => b[1].count - a[1].count)
        .slice(0, 8); // Top 8 deeds

      return {
        labels: topDeeds.map(([name]) => name),
        goodDeeds: topDeeds.map(([name, data]) => data.type === 'good' ? data.count : 0),
        badDeeds: topDeeds.map(([name, data]) => data.type === 'bad' ? data.count : 0)
      };
    }

    // Update progress display
    function updateProgressData(userData) {
      const data = getProgressData(userData);

      // Update stats
      document.getElementById('good-deeds-count').textContent = data.goodDeeds;
      document.getElementById('bad-deeds-count').textContent = data.badDeeds;
      document.getElementById('total-points').textContent = data.totalPoints;

      // Update breakdown
      updateBreakdown(data.breakdown);

      // Update chart
      updateChart(data.chartData);
    }

    function updateBreakdown(breakdown) {
      const container = document.getElementById('breakdown-container');
      
      if (!breakdown || breakdown.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <i class="bi bi-graph-up"></i>
            <h3>No Data Available</h3>
            <p>Complete some deeds in your Daily Goals to see your progress here!</p>
          </div>
        `;
        return;
      }

      container.innerHTML = '';

      breakdown.forEach(item => {
        const breakdownItem = document.createElement('div');
        breakdownItem.className = `breakdown-item ${item.type}`;
        breakdownItem.innerHTML = `
          <div>
            <strong>${item.name}</strong>
            <div style="font-size: 0.8rem; color: var(--text-muted);">
              ${item.points > 0 ? '+' : ''}${item.points} points each
            </div>
          </div>
          <div style="font-weight: bold; color: ${item.type === 'good' ? 'darkgreen' : 'darkred'}">
            ${item.count}x
          </div>
        `;
        container.appendChild(breakdownItem);
      });
    }

    function updateChart(chartData) {
      const ctx = document.getElementById('progressChart').getContext('2d');
      
      if (progressChart) {
        progressChart.destroy();
      }

      // If no data, show empty state
      if (chartData.labels.length === 0) {
        ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
        ctx.font = '16px Arial';
        ctx.fillStyle = '#6b7280';
        ctx.textAlign = 'center';
        ctx.fillText('Complete deeds to see chart data', ctx.canvas.width / 2, ctx.canvas.height / 2);
        return;
      }

      // Calculate max value for Y-axis - DYNAMIC
      const allValues = [...chartData.goodDeeds, ...chartData.badDeeds];
      const maxValue = Math.max(...allValues);
      const yAxisMax = Math.ceil(maxValue * 1.2); // Max value se 20% zyada

      progressChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: chartData.labels,
          datasets: [
            {
              label: 'Good Deeds',
              data: chartData.goodDeeds,
              backgroundColor: 'rgba(15, 109, 91, 0.8)',
              borderColor: 'darkgreen',
              borderWidth: 2
            },
            {
              label: 'Bad Deeds Avoided',
              data: chartData.badDeeds,
              backgroundColor: 'rgba(239, 70, 111, 0.8)',
              borderColor: 'darkred',
              borderWidth: 2
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            title: {
              display: true,
              text: 'Your Most Frequent Deeds',
              font: {
                size: 16,
                weight: 'bold'
              }
            },
            legend: {
              position: 'top',
              labels: {
                usePointStyle: true,
                padding: 20
              }
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              max: yAxisMax, // Dynamic max value
              ticks: {
                stepSize: calculateStepSize(maxValue), // Smart step size
                callback: function(value) {
                  if (value % 1 === 0) { // Sirf integer values dikhao
                    return value;
                  }
                }
              },
              title: {
                display: true,
                text: 'Times Completed',
                font: {
                  weight: 'bold'
                }
              }
            },
            x: {
              title: {
                display: true,
                text: 'Deeds',
                font: {
                  weight: 'bold'
                }
              },
              ticks: {
                autoSkip: false,
                maxRotation: 45,
                minRotation: 45
              }
            }
          }
        }
      });
    }

    // Smart step size calculation
    function calculateStepSize(maxValue) {
      if (maxValue <= 10) return 1;
      if (maxValue <= 20) return 2;
      if (maxValue <= 50) return 5;
      if (maxValue <= 100) return 10;
      return 20;
    }

    // Auto-update every 5 seconds to reflect real-time changes
    setInterval(() => {
      if (currentUser) {
        loadProgressData(currentUser.uid);
      }
    }, 5000);
</script>
</body>
</html>
